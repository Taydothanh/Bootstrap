<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap demo</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX"
      crossorigin="anonymous"
    />
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary small">
      <div class="container">
        <!-- Navbar Branch -->
        <a class="navbar-brand" href="#">
          <a class="navbar-brand" href="#">
            <img src="./img/logo-tuhoc-light.png" alt="Bootstrap" />
          </a>
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <!-- Menu Item -->

          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="#">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">About</a>
            </li>

            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Course</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">FAQ</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Blog</a>
            </li>
            <li class="nav-item">
              <a class="nav-link disabled" aria-disabled="true">Contact</a>
            </li>
          </ul>

          <!-- BTN dung để Đăng ký  -->
          <div class="me-2">
            <a href="#!" class="btn btn-danger btn-sm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                heigh="16"
                viewBox="0 0 640 640"
              >

              Sign up for free
            </a>

            <!-- Log in -->
            <a href="#!" class="btn btn-warning btn-sm">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                heigh="16"
                viewBox="0 0 640 640"
              >
                <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                <path

          </div>

          <!-- form Search -->
          <form class="d-flex" role="search">
            <input
              class="form-control form-control-sm me-0"
              type="search"
              placeholder="Search for.."
              aria-label="Search"
            />
            <button class="btn btn-outline-success btn-sm" type="submit">
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                heigh="16"
                viewBox="0 0 640 640"
              >
                <!--!Font Awesome Free v7.3.1 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.-->
                <path
                  d="M544 513L397.2 364.2C417.2 336.3 429.1 302 429.1 265C429.1 171.9 354.4 96.1 262.6 96.1C170.7 96 96 171.8 96 264.9C96 358 170.7 433.8 262.5 433.8C302.3 433.8 338.8 419.6 367.5 395.9L513.5 544L544 513zM262.5 394.8C191.9 394.8 134.4 336.5 134.4 264.9C134.4 193.3 191.9 135 262.5 135C333.1 135 390.6 193.3 390.6 264.9C390.6 336.5 333.2 394.8 262.5 394.8z"

      </div>
    </nav>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
